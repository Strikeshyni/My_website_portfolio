services:
  - type: web
    name: portfolio-unified-api
    runtime: python
    rootDir: server/unified_api
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: portfolio
      - key: PROJECTS_COLLECTION
        value: projects
      - key: CORS_ORIGINS
        sync: false
      - key: CHATBOT_EXTERNAL_URL
        sync: false
      - key: STOCK_EXTERNAL_URL
        sync: false