services:
  - type: web
    name: portfolio-api
    runtime: node
    rootDir: .
    plan: free
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false

  - type: web
    name: sudoku-api
    runtime: python
    rootDir: server/sudoku
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt gunicorn
    startCommand: gunicorn --bind 0.0.0.0:$PORT sudoku_api:app

  - type: web
    name: mushroom-api
    runtime: python
    rootDir: server/prediction_conform
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt gunicorn
    startCommand: gunicorn --bind 0.0.0.0:$PORT mushroom_api:app
    envVars:
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: ocr-sudoku-api
    runtime: python
    rootDir: server/ocr_sudoku
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT

# Notes:
# - Les services Chatbot et Stock étant externes à ce repo, crée-les dans Render
#   depuis leurs repos respectifs puis mets leurs URL dans vercel.json.